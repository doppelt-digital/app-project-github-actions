name: Flutter
on:
  workflow_call:

jobs:
  linux:
    uses: doppelt-digital/app-project-github-actions/.github/workflows/app.yml@main
    with:
      stack: flutter
    secrets: inherit
  macos:
    runs-on: macos-15
    env:
      CI_HOSTED_RUNNER: "true"
      CI_GIT_HOST: "github"
    steps:
      - uses: actions/checkout@v4
      - uses: doppelt-digital/app-project-github-actions/.github/actions/setup-asdf@main
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Flutter
        run: |
          set -euo pipefail
          flutter pub get
          flutter test || true
