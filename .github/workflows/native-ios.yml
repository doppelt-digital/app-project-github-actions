name: Native iOS
on:
  workflow_call:

jobs:
  ios:
    runs-on: macos-15
    env:
      CI_HOSTED_RUNNER: "true"
      CI_GIT_HOST: "github"
    steps:
      - uses: actions/checkout@v4
      - uses: doppelt-digital/app-project-github-actions/.github/actions/setup-asdf@main
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build
        run: |
          set -euo pipefail
          if ls *.xcodeproj >/dev/null 2>&1 || ls -d *.xcworkspace >/dev/null 2>&1; then
            xcodebuild -list
          else
            echo "No Xcode project at repository root yet."
          fi
