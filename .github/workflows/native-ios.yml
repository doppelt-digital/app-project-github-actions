name: Native iOS
on:
  workflow_call:

jobs:
  ios:
    runs-on: macos-15
    env:
      CI_HOSTED_RUNNER: "true"
      CI_GIT_HOST: "github"
    steps:
      - uses: actions/checkout@v4
      - uses: doppelt-digital/app-project-github-actions/.github/actions/setup-asdf@main
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build
        run: |
          set -euo pipefail
          if ls *.xcodeproj >/dev/null 2>&1 || ls -d *.xcworkspace >/dev/null 2>&1; then
            xcodebuild -list
          else
            echo "No Xcode project at repository root yet."
          fi
  screenshot-detect:
    runs-on: ubuntu-24.04
    outputs:
      capture: ${{ steps.check.outputs.capture }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [ -f .doppelt-digital-create-new-screenshots ]; then
            echo "capture=true" >> "$GITHUB_OUTPUT"
          else
            echo "capture=false" >> "$GITHUB_OUTPUT"
          fi
  screenshots:
    needs: screenshot-detect
    if: needs.screenshot-detect.outputs.capture == 'true'
    runs-on: macos-15
    env:
      CI_HOSTED_RUNNER: "true"
      CI_GIT_HOST: "github"
    steps:
      - uses: actions/checkout@v4
      - uses: doppelt-digital/app-project-github-actions/.github/actions/setup-asdf@main
      - uses: doppelt-digital/app-project-github-actions/.github/actions/store-screenshots@main
        with:
          force: "true"
