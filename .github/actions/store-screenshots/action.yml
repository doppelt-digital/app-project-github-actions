name: Store screenshots
description: Capture store screenshots and frame them per language on a GitHub-hosted runner.
inputs:
  force:
    description: Run even when the trigger file is absent.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Capture and frame
      shell: bash
      env:
        STORE_SCREENSHOTS_FORCE: ${{ inputs.force }}
        CI_HOSTED_RUNNER: "true"
        GITHUB_ACTIONS: "true"
        RUNNER_ENVIRONMENT: github-hosted
      run: bash "$GITHUB_ACTION_PATH/run.sh"
